name: X Gündem Haber Botu

on:
  schedule:
    # Günde tam 22 paylaşım (30 günde 660 haber -> ~$9.90/ay, $9.985 bakiye tam 1 ay yeter)
    # 1) TR saatiyle 07:00 - 23:00 arası her saat başı (17 paylaşım)
    - cron: "0 4-20 * * *"
    # 2) TR prime time saatlerinde buçuklarda 5 ek paylaşım (12:30, 17:30, 19:30, 21:30, 23:30)
    - cron: "30 9,14,16,18,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test modu (true = X'e paylaşmaz, sadece logda gösterir)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Türkçe karakter destekli sistem fontlarını kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Haber botunu çalıştır
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash-lite"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_POSTS_PER_RUN: "1"
          INCLUDE_SOURCE_LINK: "false"
          INCLUDE_MEDIA: "false"
          BRAND_NAME: "HABER EXE"
        run: python main.py

      - name: Paylaşılan haber geçmişini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_news.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: paylaşılan haber geçmişini güncelle [skip ci]"
            git push
          fi
