name: X Gündem Haber Botu

on:
  schedule:
    # Günde 8 en yüksek puanlı haber (TR saatiyle 09:00, 11:00, 13:00, 15:00, 17:00, 19:00, 21:00, 23:00)
    # Kredi koruma modu: ~$0.12/gün (~$3.60/ay) -> mevcut bakiye ~80 gün yeter
    - cron: "0 6,8,10,12,14,16,18,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test modu (true = X'e paylaşmaz, sadece logda gösterir)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      post_mode:
        description: "Paylaşım türü (auto = saate göre otomatik)"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "news"
          - "market"
          - "digest"

permissions:
  contents: write

concurrency:
  group: x-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Türkçe karakter destekli sistem fontlarını kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Python bağımlılıklarını kur
        run: pip install -r requirements.txt

      - name: Haber botunu çalıştır
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.1-flash-lite"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          POST_MODE: ${{ github.event.inputs.post_mode || 'auto' }}
          MAX_POSTS_PER_RUN: "1"
          INCLUDE_SOURCE_LINK: "false"
          INCLUDE_MEDIA: "true"
          BRAND_NAME: "HABER EXE"
        run: python main.py

      - name: Paylaşılan haber geçmişini ve sağlık raporunu kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_news.json data/health_report.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: haber geçmişini ve sağlık raporunu güncelle [skip ci]"
            git push
          fi
