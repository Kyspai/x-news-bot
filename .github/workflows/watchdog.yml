name: HaberExe Bulut Denetleyici (Watchdog)

on:
  workflow_run:
    workflows: ["X Gündem Haber Botu"]
    types: [completed]
  schedule:
    # Her 2 saatte bir (buçuklarda) 10 dk'dan uzun askıda kalan koşu var mı diye bakar
    - cron: "30 */2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Askıda kalan koşuları temizle ve başarısız koşuyu telafi et
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -e

          # 1. 10 dakikadan uzun süredir in_progress askıda kalan koşuları iptal et
          NOW_EPOCH=$(date -u +%s)
          gh run list --repo "$REPO" --workflow news_bot.yml --status in_progress --json databaseId,createdAt --jq '.[] | "\(.databaseId) \(.createdAt)"' | while read -r id created; do
            [ -z "$id" ] && continue
            CREATED_EPOCH=$(date -u -d "$created" +%s)
            AGE=$((NOW_EPOCH - CREATED_EPOCH))
            if [ "$AGE" -gt 600 ]; then
              echo "Askıda kalan koşu iptal ediliyor: $id (${AGE}sn)"
              gh run cancel "$id" --repo "$REPO" || true
            fi
          done

          # 2. workflow_run ile tetiklendiyse ve ana bot başarısız olduysa müdahale et
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "Tamamlanan koşu: id=$RUN_ID event=$RUN_EVENT conclusion=$RUN_CONCLUSION"
            if [ "$RUN_CONCLUSION" = "success" ]; then
              echo "✅ Haber başarıyla yayınlandı, müdahale gerekmiyor."
              exit 0
            fi

            # Sonsuz döngüyü önle: sadece zamanlanmış (schedule) koşu patladıysa 1 kez otomatik telafi et
            if [ "$RUN_EVENT" = "schedule" ]; then
              echo "⚠️ Zamanlanmış koşu başarısız ($RUN_CONCLUSION) — otomatik telafi koşusu başlatılıyor..."
              gh workflow run news_bot.yml --repo "$REPO" -f dry_run=false
              exit 0
            fi

            # Eğer telafi koşusu (workflow_dispatch) da başarısız olduysa GitHub Issue aç (bildirim düşer)
            TITLE="⚠️ HaberExe Bot Hatası (Koşu #$RUN_ID)"
            BODY="Otomatik telafi denemesi de başarısız oldu.\n\n- **Sonuç:** \`$RUN_CONCLUSION\`\n- **Koşu Linki:** $RUN_URL\n- **Öneri:** Loglarda \`402 Payment Required\` (X kredi bitmesi) veya API hatası olup olmadığını kontrol edin."
            gh issue create --repo "$REPO" --title "$TITLE" --body "$(printf '%b' "$BODY")" || true
          fi
